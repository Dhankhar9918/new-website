name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

     #check code
      - name: Checkout Code
        uses: actions/checkout@v4

      #login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build image
      - name: Build Docker Image
        run: |
          docker build -t my-name_website .

      # 4. Add tag to image
      - name: Tag Docker Image
        run: |
          docker tag my-name_website:latest dhankhar9918/new-web:kamlesh

      # 5. Push image Docker Hub
      - name: Push Docker Image
        run: |
          docker push dhankhar9918/new-web:kamlesh
          
      # 6. deploy to docker container
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/new-web:kamlesh

            docker stop mycont || true

            docker rm mycont || true

            docker run -d \
              --name mycont \
              -p 8080:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/new-web:kamlesh
